<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · Flowers Sayf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  /* Full page background styling */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Replace 'your-image.jpg' with your actual image path or URL */
    font-family: 'Inter', sans-serif;
  }

  /* Login card styling */
  .auth-card {
    background: rgba(255, 255, 255, 0.92); /* Semi-transparent white card */
    backdrop-filter: blur(8px); /* Blur effect behind card */
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    max-width: 420px;
    width: 90%;
  }
</style>
</head>
<body>

  <!-- Single Login Card overlaid on the background -->
  <div class="auth-card">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="40" height="40">
        <circle cx="24" cy="24" r="6" fill="#C9A15A"/>
        <ellipse cx="24" cy="12" rx="7" ry="10" fill="#9C2B45"/>
        <ellipse cx="24" cy="36" rx="7" ry="10" fill="#9C2B45"/>
        <ellipse cx="12" cy="24" rx="10" ry="7" fill="#9C2B45"/>
        <ellipse cx="36" cy="24" rx="10" ry="7" fill="#9C2B45"/>
      </svg>
      <span class="brand-name">Flowers Sayf<small>FRESH BOUQUETS DAILY</small></span>
    </div>

    <h1>Log in form</h1>
    <p class="lede">Log in to browse and order fresh bouquets.</p>

    <div id="authToast" class="auth-toast" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field" id="loginEmailField">
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" name="email" placeholder="Enter your email" autocomplete="email" required>
        <p class="field-error">Please enter a valid email address.</p>
      </div>

      <div class="field" id="loginPasswordField">
        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="eye-toggle" data-target="loginPassword" aria-label="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.68 19.68 0 0 1 4.22-5.36M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
        <p class="field-error">Please enter your password.</p>
      </div>

      <p class="form-note"><a href="#" style="color:var(--wine-dark, #9C2B45); font-weight:600;">Forgot password?</a></p>

      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
  </div>

<script src="script.js"></script>
</body>
</html>
